name: GITI BY SALEK HIGHTECH Build

on:
  workflow_dispatch:
  push:
    branches:
      - giti-by-salek-hightech

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-8.0.4-v2

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure (Ninja + MSVC)
        shell: pwsh
        run: cmake -S . -B build-v2 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        shell: pwsh
        run: cmake --build build-v2 --config Release --parallel

      - name: Run SHAE self-test
        shell: pwsh
        run: |
          $test = Get-ChildItem -Path build-v2 -Recurse -Filter "GITI_SHAE_SELFTEST.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $test) { Write-Error "SHAE self-test executable not found"; exit 1 }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $vst3 = Get-ChildItem -Path build-v2 -Recurse -Directory -Filter "*.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe  = Get-ChildItem -Path build-v2 -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -eq "GITI BY SALEK HIGHTECH.exe" } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build-v2 -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -match "GITI.*SALEK.*HIGHTECH.*\.exe$" } | Select-Object -First 1
          }
          Write-Host "VST3: $($vst3.FullName)"
          Write-Host "EXE:  $($exe.FullName)"
          if (-not $vst3) { Write-Error "VST3 output was not built"; exit 1 }
          if (-not $exe) {
            Write-Error "Standalone EXE was not built; refusing to publish an incomplete package"
            Get-ChildItem -Path build-v2 -Recurse -Include *.exe,*.vst3 | Select-Object FullName
            exit 1
          }
          Copy-Item -Recurse $vst3.FullName "package\GITI BY SALEK HIGHTECH.vst3"
          Copy-Item $exe.FullName "package\GITI BY SALEK HIGHTECH.exe"
          if (Test-Path "Source/Assets") {
            Copy-Item -Recurse "Source/Assets" "package/Assets"
          }
          Set-Content -Path "package\README.txt" -Value @(
            "GITI BY SALEK HIGHTECH Windows package",
            "Standalone: run GITI BY SALEK HIGHTECH.exe",
            "VST3: copy the complete GITI BY SALEK HIGHTECH.vst3 folder to C:\Program Files\Common Files\VST3, then rescan plugins in your DAW."
          ) -Encoding utf8
          Compress-Archive -Path "package\*" -DestinationPath "SALEK-HIGHTECH-Windows-Standalone-VST3.zip" -Force

      - name: Upload VST3 package
        uses: actions/upload-artifact@v4
        with:
          name: SALEK-HIGHTECH-Windows-Standalone-VST3
          path: SALEK-HIGHTECH-Windows-Standalone-VST3.zip
          if-no-files-found: error
